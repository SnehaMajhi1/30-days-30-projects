</head>

            <span class="close" onclick="colseModal()">× </span>
            <h3>Enter OTP</h3>
            <p>Please enter the 4-digit OTP</p>
            <div class="otp-box">
                <input maxlength="1">
                <input maxlength="1">
                <input maxlength="1">
                <input maxlength="1">
               <button class="btn" onclick="verifyOTP()">Verify OTP</button>
               <p class="msg" id="msg"></p>
            </div>
        </div>

    
    <script src="script.js"></script>
</body>
</html>
